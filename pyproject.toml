[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sandbox-agent"
version = "0.1.0"
description = "A high-compatibility, self-hosted LangGraph server. Built to be a drop-in replacement for LangGraph Platform, compatible with both Aegra and langgraph-cli."
readme = "README.md"
requires-python = ">=3.12,<3.13"
keywords = [
    "langgraph",
    "ai-agents",
    "self-hosted",
    "agent-backend",
    "fastapi",
    "postgresql",
    "langchain",
    "agent-protocol",
    "sandbox-agent",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
authors = [{ name = "Muhammad Ibrahim", email = "mibrahim37612@gmail.com" }]
maintainers = [{ name = "Muhammad Ibrahim", email = "mibrahim37612@gmail.com" }]
dependencies = [
    "alembic>=1.16.4",
    "asyncpg>=0.30.0",
    "fastapi",
    "greenlet>=3.2.3",
    "langchain-openai",
    "langgraph>=1.1.0",
    "langchain>=1.2.10",
    "langgraph-checkpoint-postgres",
    "psycopg[binary]>=3.2.9",
    "pydantic>=2.11.7",
    "pyjwt>=2.10.1",
    "python-dotenv>=1.1.1",
    "sqlalchemy>=2.0.0",
    "uvicorn>=0.35.0",
    "langfuse>=3.11",
    "structlog>=25.4.0",
    "asgi-correlation-id>=4.3.4",
    "langchain-ollama",
    "httpx[socks]>=0.28.1",
    "deepagents>=0.4.3",
    "tavily-python>=0.7.16",
    "llms-txt>=0.0.4",
    "mcp>=1.24.0",
    "langchain-community>=0.4.1",
    "requests>=2.32.5",
    "tiktoken>=0.12.0",
    "langchain-text-splitters>=1.1.0",
    "python-gitlab>=7.0.0",
    "qdrant-client>=1.16.2",
    "langchain-classic>=1.0.0",
    "langchain-qdrant>=1.1.0",
    "pydantic-settings>=2.12.0",
    "docker>=7.1.0",
    "aegra-cli==0.8.2",
    "aegra-api==0.8.2",
    "pytest>=9.0.2",
    "gitingest>=0.3.1",
    "tree-sitter>=0.25.2",
    "tree-sitter-python>=0.25.0",
    "tree-sitter-javascript>=0.25.0",
    "tree-sitter-typescript>=0.23.2",
]

[project.urls]
Homepage = "https://github.com/ibbybuilds/aegra"
Repository = "https://github.com/ibbybuilds/aegra"
Documentation = "https://github.com/ibbybuilds/aegra#readme"
"Bug Tracker" = "https://github.com/ibbybuilds/aegra/issues"

[tool.hatch.build.targets.wheel]
packages = ["app", "backends", "middleware", "graphs"]

[tool.hatch.build.targets.sdist]
include = [
  "/app",
  "/backends",
  "/middleware",
  "/graphs",
  "/alembic",
  "/alembic.ini",
  "/aegra.json",
  "/README.md",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "ARG", "SIM", "TCH", "PTH", "ERA"]
ignore = ["E501", "B008", "UP007", "TC002", "TC003"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ARG", "S101"]
"middleware/docker.py" = ["ERA"]
"middleware/tool_call_tracker.py" = ["ARG"]
"alembic/**/*.py" = ["ERA"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
asyncio_mode = "auto"
markers = ["e2e: marks tests as end-to-end tests"]

[tool.bandit]
exclude_dirs = ["tests", ".venv", "alembic"]
skips = ["B101"]

[tool.coverage.run]
source = ["app", "backends", "middleware", "graphs"]
omit = ["*/tests/*", "*/__pycache__/*", "*/alembic/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]
precision = 2
show_missing = true
skip_covered = false

[tool.coverage.html]
directory = "htmlcov"

[dependency-groups]
dev = [
    "ruff>=0.8.4",
    "mypy>=1.17.1",
    "pytest>=8.4.1",
    "pytest-asyncio>=1.1.0",
    "pytest-cov>=6.2.1",
    "pre-commit>=4.0.0",
    "bandit[toml]>=1.8.0",
]
